name: Update dawn-launcher source

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run update script
        run: bash scripts/update.sh

      - name: Commit and push if sources.json changed
        run: |
          if git diff --quiet -- sources.json; then
            echo "No changes to sources.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git commit -m "dawn-launcher: bump to latest version"
          git push
